site_name: Manual Completo de QA
site_url: https://marquezbertin.github.io/manual-qa-completo/
site_description: Guia passo-a-passo de QA com scripts reais (PT/EN)
site_author: Bruno Bertin Marquez
copyright: Copyright &copy; 2026 Bruno Bertin Marquez &mdash; MIT License
repo_url: https://github.com/Marquezbertin/manual-qa-completo
repo_name: Marquezbertin/manual-qa-completo
edit_uri: edit/master/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Mudar para dark
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Mudar para light
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.path
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

docs_dir: docs
site_dir: site
extra_css:
  - assets/stylesheets/extra.css
nav:
  - Home: index.md
  - "Módulos (PT)":
    - "01 — Visão Geral": 01/PT/indice.md
    - "02 — Fundamentais": 02/PT/indice.md
    - "03 — Planejamento": 03/PT/indice.md
    - "04 — Manuais e Exploratórios": 04/PT/indice.md
    - "05 — Automatizados": 05/PT/indice.md
    - "06 — API": 06/PT/indice.md
    - "07 — Performance": 07/PT/indice.md
    - "08 — Qualidade e CI/CD": 08/PT/indice.md
    - "09 — Gestão": 09/PT/indice.md
    - "10 — Templates": 10/PT/indice.md
    - "11 — Segurança (OWASP)": 11/PT/indice.md
  - "Modules (EN)":
    - "01 — Overview": 01/EN/index.md
    - "02 — Fundamentals": 02/EN/index.md
    - "03 — Planning": 03/EN/index.md
    - "04 — Manual & Exploratory": 04/EN/index.md
    - "05 — Automated": 05/EN/index.md
    - "06 — API": 06/EN/index.md
    - "07 — Performance": 07/EN/index.md
    - "08 — Quality & CI/CD": 08/EN/index.md
    - "09 — Management": 09/EN/index.md
    - "10 — Templates": 10/EN/index.md
    - "11 — Security (OWASP)": 11/EN/index.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - toc:
      permalink: true
